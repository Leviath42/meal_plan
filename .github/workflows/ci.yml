name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: App (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Placeholder requis uniquement pour le build en CI : lib/auth.ts refuse
          # NODE_ENV=production sans AUTH_SECRET. Ce n'est pas un secret réel.
          AUTH_SECRET: 'ci-build-placeholder'

  audit:
    name: Audit dépendances (production, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: npm audit (prod uniquement)
        run: npm audit --omit=dev --audit-level=high
